# Test deployment
when:
 - event: push
   branch: main
   path:
    include: ['Backend/**', '.woodpecker/backend.yaml']

steps:
 - name: publish
   # Buildx image: https://woodpecker-ci.org/plugins/docker-buildx
   image: woodpeckerci/plugin-docker-buildx:6.1.2

   settings:
    # Request elevated privilege from the system,
    # Requires an environment variable to take effect.
    privileged: true
    # Multiarch Image
    platforms: linux/amd64,linux/arm64
    registry: ghcr.io
    repo: ghcr.io/${CI_REPO,,} # Parameter expansion, checkout: https://woodpecker-ci.org/docs/usage/environment
    tags: [latest, "${CI_COMMIT_SHA:0:8}"] # The image gets latest plus the first 8 characters of the commit SHA
    dockerfile: Backend/Dockerfile
    context: Backend

    # Taken from woodpecker secrets
    username: ${CI_REPO_OWNER}
    password:
     from_secret: ghcr_token
   
   # Test deployment
 - name: deploy
   image: alpine:3
   environment:
    KOMODO_WEBHOOK_URL:
     from_secret: komodo_webhook_url
    KOMODO_WEBHOOK_SECRET:
     from_secret: komodo_webhook_secret
   commands:
    - apk add --no-cache curl openssl
    - | 
      PAYLOAD='{"ref":"refs/heads/main"}'
      SIG=$(printf '%s' "$PAYLOAD" | openssl dgst -sha256 -hmac "$KOMODO_WEBHOOK_SECRET" -r | cut -d' ' -f1)
      curl -fsS -X POST "KOMODO_WEBHOOK_URL" \
       -H "Content-Type: application/json"
       -H "X-Hub-Signature-256: sha256=$SIG"
       -d "$PAYLOAD"
