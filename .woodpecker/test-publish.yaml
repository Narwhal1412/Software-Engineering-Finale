# Test deployment
when:
 - event: push
   branch: main

steps:
 - name: publish
   image: woodpeckerci/plugin-docker-buildx
   settings:
    # Multiarch Image
    platforms: windows/amd64,darwin/amd64,darwin/arm64,freebsd/amd64,linux/amd64,linux/arm64/v8
    registry: ghcr.io
    repo: ghcr.io/${CI_REPO,,} # Parameter expansion, checkout: https://woodpecker-ci.org/docs/usage/environment
    tags: [latest, "${CI_COMMIT_SHA:0:8}"] # The image gets latest plus the first 8 characters of the commit SHA
    dockerfile: Backend/Dockerfile
    context: Backend
    username:
     from_secret: ghcr_username
    password:
     from_secret: ghcr_token
