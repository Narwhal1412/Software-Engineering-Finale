# =============================================================================
# compose.override.yaml: Docker Compose tự đọc file này khi chạy `docker compose up`.
# Chỉ chứa phần dành cho máy local: mở cổng để truy cập bằng localhost.
# =============================================================================
services:
  frontend:
    ports:
      - "80:80"          # Giao diện: http://localhost  (đổi bằng WEB_PORT trong .env)
  backend:
    ports:
      - "3000:3000"                   # Gọi API trực tiếp (Bruno dùng http://localhost:3000)
  db:
    ports:
      - "127.0.0.1:3306:3306"         # Chỉ máy bạn kết nối được (DBeaver, HeidiSQL, mysql client)
