# It should not containt any ports
services:
 db:
  image: mariadb:11
  environment:
   MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
   MARIADB_DATABASE: ${DB_NAME}
   MARIADB_USER: ${DB_USER}
   MARIADB_PASSWORD: ${DB_PASSWORD}
  volumes:
   - db_data:/var/lib/mysql
   - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  healthcheck:
   test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
   interval: 10s
   timeout: 5s
   retries: 5 
 
 # Backend
 backend:
  build: ./Backend
  environment:
   DB_HOST: ${DB_HOST}
   DB_PORT: ${DB_PORT}
   DB_NAME: ${DB_NAME}
   DB_USER: ${DB_USER}
   DB_PASSWORD: ${DB_PASSWORD}
  depends_on:
   db: 
    # Passes health check
    condition: service_healthy
 
 # Frontend 
 frontend:
  build: ./Frontend
  depends_on:
   - backend

volumes:
 db_data:
