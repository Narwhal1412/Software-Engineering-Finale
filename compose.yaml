# =============================================================================
# compose.yaml: định nghĩa 3 service chạy cùng nhau (Frontend, Backend, Database).
# File này KHÔNG mở cổng nào ra ngoài (cổng cho máy local nằm ở compose.override.yaml,
# nhãn Traefik cho server nằm ở compose.prod.yaml).
# Biến ${...} lấy từ file .env (sao chép từ .env.example).
# =============================================================================
services:
  frontend:
    build: ./Frontend
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build: ./Backend
    restart: unless-stopped
    environment:
      # Cổng nội bộ cố định 3000 vì nginx của frontend proxy tới backend:3000.
      APP_PORT: "3000"
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET:?Hãy đặt JWT_SECRET (>= 16 ký tự) trong file .env}
      JWT_TTL_HOURS: ${JWT_TTL_HOURS:-24}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
      RUST_LOG: ${RUST_LOG:-info,tower_http=debug}
      # Thông tin DB. Backend CHƯA dùng khi còn chạy mock; truyền sẵn để lúc gắn DB thật
      # không phải sửa compose. DB_HOST = tên service "db" bên dưới (Docker tự phân giải tên).
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER:?Hãy đặt DB_USER trong file .env}
      DB_PASSWORD: ${DB_PASSWORD:?Hãy đặt DB_PASSWORD trong file .env}
      DB_NAME: ${DB_NAME:?Hãy đặt DB_NAME trong file .env}
    volumes:
      # Ảnh upload nằm ngoài container để không mất khi build/chạy lại.
      - uploads:/app/uploads
    # KHI ĐÃ GẮN DB THẬT: bỏ dấu # ở 3 dòng dưới để backend chỉ khởi động sau khi DB sẵn sàng.
    # (Đang để tắt vì lúc này backend chạy mock; nếu init.sql lỗi thì không nên làm sập cả demo.)
    # depends_on:
    #   db:
    #     condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Hãy đặt DB_ROOT_PASSWORD trong file .env}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      # Mọi file .sql trong thư mục này được chạy MỘT LẦN khi volume db_data còn trống.
      - type: bind
        source: ./Database/init scripts
        target: /docker-entrypoint-initdb.d
        read_only: true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  uploads:
  db_data:
