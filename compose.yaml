services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./Backend/database/database.sql:/docker-entrypoint-initdb.d/001_seed.sql:ro

  backend:
    build:
      context: ./Backend/hello-service
    environment:
      APP_PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: app
      DB_PASSWORD: app_password
      DB_NAME: app_db
      DB_SSLMODE: disable
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    labels:
      - "traefik.http.routers.test.rule=Host(`webapp.hatamoto.uk`)"
    build:
      context: ./Frontend
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
