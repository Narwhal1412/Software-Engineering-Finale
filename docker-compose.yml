services:
  test-app:
    image: traefik/whoami
    labels:
      # Tells Traefik to route traffic to this specific container
      - "traefik.enable=true"
      # Defines the exact URL you want to use for this app
      - "traefik.http.routers.testapp.rule=Host(`app.yourdomain.com`)"
    networks:
      - komodo_default

networks:
  komodo_default:
    external: true
