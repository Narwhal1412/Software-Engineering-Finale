# Ngoài API.md (endpoint hạ tầng của Agent 1), thêm để biết server đã sống trước khi chạy test.
info:
  name: "Health check"
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/health"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        test("status = ok", function () {
          expect(res.body).to.have.property("status", "ok");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

