# Lưu adminToken cho mọi request admin phía sau.
info:
  name: "Login admin"
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        const isUser = (u) => typeof u.id === "number" && typeof u.email === "string" && typeof u.displayName === "string" && typeof u.phone === "string" && typeof u.address === "string" && ["user","admin"].includes(u.role) && !("passwordHash" in u) && !("password_hash" in u) && !("password" in u);

        test("có user (role admin) và token", function () {
          expect(res.body.token).to.be.a("string").and.not.empty;
          expect(isUser(res.body.user)).to.equal(true);
          expect(res.body.user.role).to.equal("admin");
          expect(res.body.user.email).to.equal("admin@pc.vn");
        });
    - type: after-response
      code: |-
        bru.setVar("adminToken", res.body.token);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

