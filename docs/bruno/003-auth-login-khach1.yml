# khach1: có 4 đơn và 2 dòng trong giỏ. Lưu userToken, userId.
info:
  name: "Login khach1"
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{userEmail}}",
        "password": "{{userPassword}}"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        const isUser = (u) => typeof u.id === "number" && typeof u.email === "string" && typeof u.displayName === "string" && typeof u.phone === "string" && typeof u.address === "string" && ["user","admin"].includes(u.role) && !("passwordHash" in u) && !("password_hash" in u) && !("password" in u);

        test("role user", function () {
          expect(isUser(res.body.user)).to.equal(true);
          expect(res.body.user.role).to.equal("user");
          expect(res.body.user.displayName).to.equal("Nguyễn Văn An");
        });
    - type: after-response
      code: |-
        bru.setVar("userToken", res.body.token);
        bru.setVar("userId", res.body.user.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

