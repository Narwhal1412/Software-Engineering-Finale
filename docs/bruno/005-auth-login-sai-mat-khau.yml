# Sai mật khẩu trả 400 (không phải 401) – xem giả định A8/B3.
info:
  name: "Login sai mật khẩu"
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "{{userEmail}}",
        "password": "sai-mat-khau"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Sai email hoặc mật khẩu");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

