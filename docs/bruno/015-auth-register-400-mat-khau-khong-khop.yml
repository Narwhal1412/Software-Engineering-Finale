info:
  name: "Register mật khẩu nhập lại không khớp"
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "khong.khop@pc.vn",
        "displayName": "Không Khớp",
        "password": "123456",
        "confirmPassword": "654321"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Mật khẩu nhập lại không khớp");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

