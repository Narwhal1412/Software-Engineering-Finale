info:
  name: "Register sai kiểu dữ liệu"
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "email": "sai.kieu@pc.vn",
        "displayName": "Sai Kiểu",
        "password": 123456,
        "confirmPassword": 123456
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Dữ liệu gửi lên không hợp lệ");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

