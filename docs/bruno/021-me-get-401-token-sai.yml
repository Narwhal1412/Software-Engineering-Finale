info:
  name: "Get me token sai"
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Authorization
      value: "Bearer token.sai.khong.hop.le"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Phiên đăng nhập đã hết hạn, hãy đăng nhập lại");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

