info:
  name: "Update me thiếu tên hiển thị"
  type: http
  seq: 23

http:
  method: PUT
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{userToken}}"
  body:
    type: json
    data: |-
      {
        "displayName": "",
        "phone": "0912345678",
        "address": "TP.HCM"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Nhập tên hiển thị");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

