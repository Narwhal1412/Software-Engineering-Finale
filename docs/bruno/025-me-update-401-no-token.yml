info:
  name: "Update me không token"
  type: http
  seq: 25

http:
  method: PUT
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "displayName": "Ẩn Danh",
        "phone": "",
        "address": ""
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Cần đăng nhập");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

