# Lưu categoryId để dùng cho sản phẩm và các bước sửa/xóa.
info:
  name: "Create category"
  type: http
  seq: 27

http:
  method: POST
  url: "{{baseUrl}}/api/categories"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "name": "Màn hình"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 201", function () {
          expect(res.status).to.equal(201);
        });

        test("trả {id, name}", function () {
          expect(res.body.id).to.be.a("number");
          expect(res.body.name).to.equal("Màn hình");
        });
    - type: after-response
      code: |-
        bru.setVar("categoryId", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true

