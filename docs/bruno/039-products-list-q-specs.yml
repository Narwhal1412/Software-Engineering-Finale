info:
  name: "List products tìm theo specs"
  type: http
  seq: 39

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: q
      value: "DDR5"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        test("tìm được trong specs", function () {
          expect(res.body.map((p) => p.name)).to.include("Kingston Fury 32GB");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

