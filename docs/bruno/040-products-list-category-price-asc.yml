info:
  name: "List products lọc danh mục, giá tăng dần"
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: categoryId
      value: "2"
      type: query
    - name: sort
      value: "priceAsc"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        test("chỉ danh mục 2, giá tăng dần", function () {
          expect(res.body.map((p) => p.id)).to.deep.equal([4, 3]);
          res.body.forEach((p) => expect(p.categoryId).to.equal(2));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

