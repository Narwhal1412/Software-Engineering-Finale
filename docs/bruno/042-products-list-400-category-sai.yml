info:
  name: "List products categoryId không phải số"
  type: http
  seq: 42

http:
  method: GET
  url: "{{baseUrl}}/api/products"
  params:
    - name: categoryId
      value: "abc"
      type: query

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Danh mục không hợp lệ");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

