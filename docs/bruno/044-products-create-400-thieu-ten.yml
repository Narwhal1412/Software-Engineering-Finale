info:
  name: "Create product thiếu tên"
  type: http
  seq: 44

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "specs": "2K IPS 165Hz",
        "price": 6490000
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Nhập tên sản phẩm");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

