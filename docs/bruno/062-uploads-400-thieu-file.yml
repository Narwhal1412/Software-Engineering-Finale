info:
  name: "Upload không có trường file"
  type: http
  seq: 62

http:
  method: POST
  url: "{{baseUrl}}/api/uploads"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: multipart-form
    data:
      - name: note
        type: text
        value: "khong-co-file"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Chưa chọn ảnh");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

