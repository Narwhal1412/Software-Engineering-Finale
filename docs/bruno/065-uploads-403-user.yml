info:
  name: "Upload bằng user thường"
  type: http
  seq: 65

http:
  method: POST
  url: "{{baseUrl}}/api/uploads"
  headers:
    - name: Authorization
      value: "Bearer {{userToken}}"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - fixtures/pixel.png

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 403", function () {
          expect(res.status).to.equal(403);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Cần quyền quản trị");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true

