info:
  name: "Upload không token"
  type: http
  seq: 66

http:
  method: POST
  url: "{{baseUrl}}/api/uploads"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - fixtures/pixel.png

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Cần đăng nhập");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

