info:
  name: "Get cart khach3 (trống)"
  type: http
  seq: 67

http:
  method: GET
  url: "{{baseUrl}}/api/cart"
  headers:
    - name: Authorization
      value: "Bearer {{user3Token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        test("giỏ trống", function () {
          expect(res.body).to.deep.equal([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

