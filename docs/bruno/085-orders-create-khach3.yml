# Giỏ khach3 lúc này: sản phẩm 1 x5 (9.490.000) → total 47.450.000.
info:
  name: "Place order khach3 từ giỏ"
  type: http
  seq: 85

http:
  method: POST
  url: "{{baseUrl}}/api/orders"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{user3Token}}"
  body:
    type: json
    data: |-
      {
        "fullName": "Lê Hoàng Cường",
        "phone": "0987654321",
        "address": "45 Lê Lợi, Quận 1, TP.HCM",
        "paymentMethod": "cod"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 201", function () {
          expect(res.status).to.equal(201);
        });

        const isOrder = (o) => typeof o.id === "number" && Array.isArray(o.items) && o.items.every((i) => typeof i.productId === "number" && typeof i.name === "string" && typeof i.price === "number" && typeof i.quantity === "number") && typeof o.total === "number" && ["pending","confirmed","shipped","completed","cancelled"].includes(o.status) && ["cod","bank"].includes(o.paymentMethod) && typeof o.fullName === "string" && typeof o.phone === "string" && typeof o.address === "string" && typeof o.createdAt === "string";

        test("đơn pending, tổng tiền đúng, giá là snapshot", function () {
          expect(isOrder(res.body)).to.equal(true);
          expect(res.body.status).to.equal("pending");
          expect(res.body.paymentMethod).to.equal("cod");
          expect(res.body.total).to.equal(47450000);
          expect(res.body.items).to.deep.equal([{ productId: 1, name: "Ryzen 7 7800X3D", price: 9490000, quantity: 5 }]);
        });
    - type: after-response
      code: |-
        bru.setVar("order3Id", res.body.id);
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true

