info:
  name: "Place order thiếu họ tên"
  type: http
  seq: 87

http:
  method: POST
  url: "{{baseUrl}}/api/orders"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{userToken}}"
  body:
    type: json
    data: |-
      {}

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Nhập họ tên");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

