# 4 đơn seed + 1 đơn vừa đặt; mới nhất đứng đầu (A20).
info:
  name: "List orders của khach1"
  type: http
  seq: 94

http:
  method: GET
  url: "{{baseUrl}}/api/orders"
  headers:
    - name: Authorization
      value: "Bearer {{userToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 200", function () {
          expect(res.status).to.equal(200);
        });

        const isOrder = (o) => typeof o.id === "number" && Array.isArray(o.items) && o.items.every((i) => typeof i.productId === "number" && typeof i.name === "string" && typeof i.price === "number" && typeof i.quantity === "number") && typeof o.total === "number" && ["pending","confirmed","shipped","completed","cancelled"].includes(o.status) && ["cod","bank"].includes(o.paymentMethod) && typeof o.fullName === "string" && typeof o.phone === "string" && typeof o.address === "string" && typeof o.createdAt === "string";

        test("chỉ đơn của khach1, đơn mới ở đầu", function () {
          expect(res.body).to.have.length(5);
          res.body.forEach((o) => expect(isOrder(o)).to.equal(true));
          expect(res.body[0].id).to.equal(bru.getVar("orderId"));
          res.body.forEach((o) => expect(o).to.not.have.property("userEmail"));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true

