info:
  name: "Admin đổi trạng thái đơn đã hoàn tất"
  type: http
  seq: 102

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/orders/{{orderId}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "status": "pending"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 409", function () {
          expect(res.status).to.equal(409);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Đơn hàng đã hoàn tất hoặc đã hủy, không thể đổi trạng thái");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "409"

settings:
  encodeUrl: true

