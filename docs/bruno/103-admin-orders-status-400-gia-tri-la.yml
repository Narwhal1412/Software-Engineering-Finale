info:
  name: "Admin đổi trạng thái không hợp lệ"
  type: http
  seq: 103

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/orders/{{order3Id}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: Authorization
      value: "Bearer {{adminToken}}"
  body:
    type: json
    data: |-
      {
        "status": "done"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 400", function () {
          expect(res.status).to.equal(400);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Trạng thái không hợp lệ");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "400"

settings:
  encodeUrl: true

