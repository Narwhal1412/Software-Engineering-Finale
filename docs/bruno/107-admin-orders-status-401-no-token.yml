info:
  name: "Admin đổi trạng thái không token"
  type: http
  seq: 107

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/orders/{{order3Id}}"
  headers:
    - name: Content-Type
      value: "application/json"
  body:
    type: json
    data: |-
      {
        "status": "shipped"
      }

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Cần đăng nhập");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

