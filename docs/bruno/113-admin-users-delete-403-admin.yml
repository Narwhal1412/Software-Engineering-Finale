info:
  name: "Admin xóa tài khoản admin"
  type: http
  seq: 113

http:
  method: DELETE
  url: "{{baseUrl}}/api/admin/users/1"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 403", function () {
          expect(res.status).to.equal(403);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Không thể xóa tài khoản admin");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true

