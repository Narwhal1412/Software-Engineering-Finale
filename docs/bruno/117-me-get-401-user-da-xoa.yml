# Quyền luôn đối chiếu lại với DB nên token của tài khoản đã xóa mất hiệu lực (A13).
info:
  name: "Get me bằng token của user đã bị xóa"
  type: http
  seq: 117

http:
  method: GET
  url: "{{baseUrl}}/api/me"
  headers:
    - name: Authorization
      value: "Bearer {{newUserToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Phiên đăng nhập đã hết hạn, hãy đăng nhập lại");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

