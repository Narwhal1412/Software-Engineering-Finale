info:
  name: "Delete category không token"
  type: http
  seq: 120

http:
  method: DELETE
  url: "{{baseUrl}}/api/categories/{{categoryId}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 401", function () {
          expect(res.status).to.equal(401);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Cần đăng nhập");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "401"

settings:
  encodeUrl: true

