info:
  name: "Delete product"
  type: http
  seq: 127

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/{{productId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 204", function () {
          expect(res.status).to.equal(204);
        });

        test("không có body", function () {
          expect(res.body === "" || res.body === undefined || res.body === null).to.equal(true);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true

