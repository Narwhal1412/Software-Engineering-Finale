info:
  name: "Delete product lần hai"
  type: http
  seq: 128

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/{{productId}}"
  headers:
    - name: Authorization
      value: "Bearer {{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("HTTP 404", function () {
          expect(res.status).to.equal(404);
        });

        test("body lỗi có dạng {message} đúng nội dung", function () {
          expect(res.body).to.have.property("message", "Không tìm thấy sản phẩm");
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "404"

settings:
  encodeUrl: true

